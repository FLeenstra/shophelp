server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend service. Using a variable + Docker's
    # embedded DNS resolver (127.0.0.11) forces nginx to re-resolve the
    # backend hostname at request time, so it survives backend restarts
    # (a static proxy_pass would cache the IP at startup and 502 after a redeploy).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://backend:8080;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
