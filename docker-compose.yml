services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shophelp
      POSTGRES_USER: shophelp
      POSTGRES_PASSWORD: shophelp
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shophelp -d shophelp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/shophelp
      SPRING_DATASOURCE_USERNAME: shophelp
      SPRING_DATASOURCE_PASSWORD: shophelp
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  db-data:
